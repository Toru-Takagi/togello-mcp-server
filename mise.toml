[tools]
node = "24.22.1"

[tasks.install]
description = "Install locked dependencies, including TypeScript"
run = "npm ci --include=dev"

[tasks.build]
description = "Install dependencies and build the server"
depends = ["install"]
run = "npm run build"

[tasks.test]
description = "Install dependencies, build, and run the local protocol tests"
depends = ["install"]
run = "npm test"

[tasks.release]
description = "Test, publish, and push a release to origin/main"
usage = 'arg "<version>" help="A version such as 1.0.51, or patch"'
interactive = true
run = 'node scripts/release.mjs "$usage_version"'

[tasks.patch]
description = "Publish and push a patch release, or resume a pending release"
depends = ["release patch"]
